<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../carpeta-css/login.css">
    <title>Login</title>
</head>
<body>
      <a href="../index.html" class="atras"> <img src="../imag/regresar.png" alt="atras"> </a>
      
    <header class="page-container">
        <section class="image-panel">
            <img src="../imag/fondo.png" alt="fondo">
        </section>
        <section class="form-panel">
            <header class="imagen_logo">
                <article class="img_1">
                    <img class="img_2" src="../imag/logo.jpeg" alt="logo">           
                </article>
                <h2>SIGNA-TECH-APP</h2>
            </header>
            <main>
                <h2>Bienvenido</h2>
                <p>inicia sesión para acceder a tu cuenta</p>
        <form>
            <article>
                    <label for="email">Correo electónico</label><br>
                    <input id="email" name="email" type="email" placeholder="tu@gmail.com" required>
            </article>
            <article class="label-row">
                <label for="pass">Contraseña</label> 
                <a href="./contrasena.html" class="forgot-password">¿Olvidaste tu contraseña?</a> <br>
               <input id="pass" name="password" type="password" placeholder="••••••••••••" required>
            </article>
             <article class="recordar">
                <input id="remember" type="checkbox">
                <label for="remember">Recordar mi sesión</label>
            </article>
            <nav><button type="submit" class="btn-login">Iniciar sesión <span>&rarr;</span></button></nav>
                <section class="divisor-contenedor"> <samp class="divisor-texto">¿Nuevo en SIGNA-TECH?</samp></section>
                <section class="boton">
                    <a href="./nv_cuenta.html" class="btn-create-account">Crear cuenta nueva</a>
                </section>
        </form>
            </main>
        </section>
    </header>        
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
