<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../carpeta-css/nv_cuenta.css">
    <title>Nueva Cuenta</title>
</head>
<body>
      <a href="./login.html" class="atras"> <img src="../imag/regresar.png" alt="atras"> </a>
      
<article class="fondo"></article>
    <section>
        <h1>SIGNA-TECH-APP</h1>
        <P>Crear nueva cuenta</P>
        <form>
             <article>
                <label for="nombre">Nombre completo </label><br>
                <input id="nombre" name="name" type="text" placeholder="Angela Garces" required>
            </article>
            <br>
            <article>
                <label for="email">Correo electrónico</label><br>
               <input id="email" name="email" type="email" placeholder="tu@gmail.com" required>
             </article>
             <br>
              <article>
                <label for="pass">Contraseña</label> <br>
               <input id="pass" name="password" type="password" placeholder="••••••••••••" required minlength="8">
             </article>
             <br>
              <article>
                <label for="confirmation">confirmar contraseña</label> <br>
               <input id="confirmation" name="confirmation" type="password" placeholder="••••••••••••" required minlength="8">
             </article>
             <br>
              <button type="submit" class="crear">Crear cuenta</button>
                <br>
                <br>
             <a href="./login.html">¿Ya tienes cuenta? Inicia sesión</a>
        </form>
    </section>
    <script src="../JS/nv_cuenta.js"></script>
</body>
</html>
